<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vladimir Vilde</title>
  <meta name="description" content="Projects, hobbies and business of Vladimir Vilde.">
  <link rel="icon" href="assets/img/photo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=10">
  <script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">vladimir-vilde</a>
      <div class="nav">
      <nav class="tabs">
        <a href="index.html" aria-current="page">Home</a>
        <a href="business.html">Business</a>
        <a href="profile.html">Profile</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
      </div>
    </div>
  </header>

  <main>
    <section class="wrap hero" id="hero"></section>

    <section class="gallery" aria-labelledby="gallery-title">
      <div class="wrap gallery-head">
        <div>
          <h2 id="gallery-title">Projects and hobbies</h2>
          <p>Drag the windows around. Click one to open it.</p>
        </div>
        <div class="controls">
          <button class="filter" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" data-filter="project" aria-pressed="false"><i class="swatch project"></i>Projects</button>
          <button class="filter" data-filter="hobby" aria-pressed="false"><i class="swatch hobby"></i>Hobbies</button>
          <button class="filter" id="shuffle">Shuffle</button>
        </div>
      </div>
      <div class="desktop" id="desktop"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap mono">
      <span>&copy; <span id="year"></span> <span data-name></span></span>
    </div>
  </footer>

  <script src="assets/js/data.js?v=11"></script>
  <script src="assets/js/garden.js?v=8"></script>
  <script src="assets/js/site.js?v=8"></script>
</body>
</html>
